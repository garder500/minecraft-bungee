# La fenêtre de confirmation (suppression d'un warp) : aucun mot n'est peint, le titre et ces infobulles disent tout.
confirm:
  delete_warp: "Supprimer <name>"
  warning: "Cette action est irréversible."
  cancel: "Annuler"
  cancel_info: "Revenir en arrière, rien ne change"
