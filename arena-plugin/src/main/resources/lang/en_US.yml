# English: the source and the fallback. One  key: "TEXT"  per line, nothing else (three readers: HudLang.java,
# resource-pack/art/hud_sheet.py, scripts/check_lang_parity.py). Same keys in fr_FR.yml and de_DE.yml.
# The werewolf HUD writes these in capitals with its own pixel fonts: letters, digits, . , : / - ' ! ? & + and the
# accents of French and German. Each line has a width in pixels (scripts/test_hud_sheet.py fails when a word is too
# wide): the phase about 14 letters, a role 12, a team 14, the two lines of the vote caption 8 and 10.
# Keys: hud.phase.<label>, hud.role.<word>, hud.team.<word>; <label> and <word> are the words of roles/*.json
# (call.label, word, teamWord) and of CustomHud.of, in lower case with _ for anything that is not a letter or digit.

