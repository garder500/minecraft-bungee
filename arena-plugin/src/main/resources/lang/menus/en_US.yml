# English: the source of the menu texts of the arena plugin (docs/i18n.md): window titles, item names and tooltips of the
# Werewolf role menus, the village overview and the confirmation window. Their backgrounds paint no word, so these are
# the only labels a player reads. Read by win.vampyuyu.arena.ArenaLang; fr_FR.yml and de_DE.yml carry the same keys and
# {placeholders} (python3 scripts/check_lang_parity.py, ArenaLangTest). One  key: "text"  per line, plain text (the
# plugin colours each line), no double quote or backslash inside: the same format as ../<tag>.yml (the HUD words), so the
# two sets can be merged.

# The confirmation window (ArenaAdmin.confirm): {action} is the window's title
