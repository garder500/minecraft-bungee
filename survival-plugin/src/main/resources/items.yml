    farmers_hoe: {result: farmers_hoe, amount: 1, shape: ["II", " C", " C"], ingredients: {I: IRON_INGOT, C: COPPER_INGOT}}
    diggers_shovel: {result: diggers_shovel, amount: 1, shape: ["I", "C", "C"], ingredients: {I: IRON_INGOT, C: COPPER_INGOT}}
    grappling_hook: {result: grappling_hook, amount: 1, shape: ["  I", " IS", "I S"], ingredients: {I: IRON_INGOT, S: STRING}}
    warp_pearl: {result: warp_pearl, amount: 1, shape: ["EC", "CE"], ingredients: {E: ENDER_PEARL, C: CHORUS_FRUIT}}
    hot_potato_book: {result: hot_potato_book, amount: 1, shape: ["PGP", "GBG", "PGP"], ingredients: {P: BAKED_POTATO, G: GOLDEN_CARROT, B: BOOK}}
    miner_helmet_t1: {result: miner_helmet_t1, amount: 1, shape: ["MMM", "M M"], ingredients: {M: COBBLESTONE}}
    miner_chestplate_t1: {result: miner_chestplate_t1, amount: 1, shape: ["M M", "MMM", "MMM"], ingredients: {M: COBBLESTONE}}
    miner_leggings_t1: {result: miner_leggings_t1, amount: 1, shape: ["MMM", "M M", "M M"], ingredients: {M: COBBLESTONE}}
    miner_boots_t1: {result: miner_boots_t1, amount: 1, shape: ["M M", "M M"], ingredients: {M: COBBLESTONE}}
    lumberjack_helmet_t1: {result: lumberjack_helmet_t1, amount: 1, shape: ["MMM", "M M"], ingredients: {M: OAK_LOG}}
    lumberjack_chestplate_t1: {result: lumberjack_chestplate_t1, amount: 1, shape: ["M M", "MMM", "MMM"], ingredients: {M: OAK_LOG}}
    lumberjack_leggings_t1: {result: lumberjack_leggings_t1, amount: 1, shape: ["MMM", "M M", "M M"], ingredients: {M: OAK_LOG}}
    lumberjack_boots_t1: {result: lumberjack_boots_t1, amount: 1, shape: ["M M", "M M"], ingredients: {M: OAK_LOG}}
    farmer_helmet_t1: {result: farmer_helmet_t1, amount: 1, shape: ["MMM", "M M"], ingredients: {M: WHEAT}}
    farmer_chestplate_t1: {result: farmer_chestplate_t1, amount: 1, shape: ["M M", "MMM", "MMM"], ingredients: {M: WHEAT}}
    farmer_leggings_t1: {result: farmer_leggings_t1, amount: 1, shape: ["MMM", "M M", "M M"], ingredients: {M: WHEAT}}
    farmer_boots_t1: {result: farmer_boots_t1, amount: 1, shape: ["M M", "M M"], ingredients: {M: WHEAT}}
    hunter_helmet_t1: {result: hunter_helmet_t1, amount: 1, shape: ["MMM", "M M"], ingredients: {M: BONE}}
    hunter_chestplate_t1: {result: hunter_chestplate_t1, amount: 1, shape: ["M M", "MMM", "MMM"], ingredients: {M: BONE}}
    hunter_leggings_t1: {result: hunter_leggings_t1, amount: 1, shape: ["MMM", "M M", "M M"], ingredients: {M: BONE}}
    hunter_boots_t1: {result: hunter_boots_t1, amount: 1, shape: ["M M", "M M"], ingredients: {M: BONE}}
