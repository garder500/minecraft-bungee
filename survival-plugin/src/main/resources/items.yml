# ------------------------------------------------------------------------------------------------ loot
# Item loot of boss kills (registered with BossApi when the boss feature is loaded), natural mob kills and fishing.
# chance is a percent per roll: multiplied by (1 + Magic Find / 100), pet rows by (1 + Pet Luck / 100). Row sources:
# boss, boss:<id>, mob, mob:<ENTITY_TYPE>, fishing. Kinds: item (catalog id, @armor:N = random armor piece of tier N),
# book (enchant id or @ultimate, level .. max-level) and pet (species id + rarity).
loot:
  enabled: true
  chance-cap: 100                  # no roll is ever above this percent
  mob-level-bonus: 0.05            # mob drops: chance x (1 + mob level * this)
  mob-spawn-reasons: [NATURAL, CHUNK_GEN, PATROL, RAID, REINFORCEMENTS, VILLAGE_INVASION, JOCKEY, TRAP]
  entries:
    - {kind: book, id: sharpness, level: 6, chance: 0.12, sources: ["mob"]}
    - {kind: book, id: power, level: 6, chance: 0.12, sources: ["mob"]}
    - {kind: book, id: protection, level: 6, chance: 0.12, sources: ["mob"]}
    - {kind: book, id: growth, level: 6, chance: 0.12, sources: ["mob"]}
    - {kind: book, id: critical, level: 6, chance: 0.12, sources: ["mob"]}
    - {kind: book, id: efficiency, level: 6, chance: 0.12, sources: ["mob"]}
    - {kind: item, id: hot_potato_book, chance: 0.5, sources: ["mob"]}
    - {kind: item, id: pet_candy, chance: 0.6, sources: ["mob"]}
    - {kind: item, id: reforge_stone_fabled, chance: 0.06, sources: ["mob"]}
    - {kind: item, id: recombobulator, chance: 0.015, sources: ["mob"]}
    - {kind: item, id: warp_pearl, chance: 0.8, sources: ["mob:ENDERMAN"]}
    - {kind: pet, id: wolf, rarity: COMMON, chance: 0.12, sources: ["mob:ZOMBIE", "mob:SKELETON", "mob:SPIDER"]}
    - {kind: pet, id: enderman, rarity: RARE, chance: 0.1, sources: ["mob:ENDERMAN"]}
    - {kind: pet, id: tiger, rarity: EPIC, chance: 0.04, sources: ["mob:BLAZE", "mob:WITHER_SKELETON"]}
    - {kind: item, id: pet_candy, chance: 1, sources: ["fishing"]}
    - {kind: item, id: warp_pearl, chance: 1.5, sources: ["fishing"]}
    - {kind: item, id: reforge_stone_fabled, chance: 0.2, sources: ["fishing"]}
    - {kind: item, id: rod_of_legends, chance: 0.03, sources: ["fishing"]}
    - {kind: pet, id: turtle, rarity: UNCOMMON, chance: 0.4, sources: ["fishing"]}
    - {kind: pet, id: rabbit, rarity: COMMON, chance: 0.25, sources: ["fishing"]}
    - {kind: book, id: "@ultimate", max-level: 2, chance: 18, sources: ["boss"]}
    - {kind: book, id: sharpness, level: 7, chance: 12, sources: ["boss"]}
    - {kind: book, id: protection, level: 7, chance: 12, sources: ["boss"]}
    - {kind: book, id: critical, level: 7, chance: 10, sources: ["boss"]}
    - {kind: item, id: "@armor:2", chance: 20, sources: ["boss"]}
    - {kind: item, id: "@armor:3", chance: 3, sources: ["boss"]}
    - {kind: item, id: reforge_stone_withered, chance: 14, sources: ["boss"]}
    - {kind: item, id: reforge_stone_ancient, chance: 5, sources: ["boss"]}
    - {kind: item, id: reforge_stone_refined, chance: 1.5, sources: ["boss"]}
    - {kind: item, id: recombobulator, chance: 6, sources: ["boss"]}
    - {kind: item, id: drill_fuel_volta, chance: 10, sources: ["boss"]}
    - {kind: item, id: wither_blade, chance: 0.7, sources: ["boss"]}
    - {kind: item, id: titan_drill, chance: 0.5, sources: ["boss"]}
    - {kind: pet, id: tiger, rarity: EPIC, chance: 4, sources: ["boss"]}
    - {kind: pet, id: phoenix, rarity: EPIC, chance: 3, sources: ["boss"]}
    - {kind: pet, id: ender_dragon, rarity: LEGENDARY, chance: 1.5, sources: ["boss"]}

# ------------------------------------------------------------------------------------------------ costs
costs:
  require-economy: false           # true = menus refuse to work while the economy feature is unavailable
  enchant-table:
    base: 150                      # coins: base * growth^(level-1) * level
    growth-per-level: 1.9
    enchanting-xp-per-level: 12    # Enchanting skill XP per enchant level bought (through SkillsApi.addXp)
    skill-levels-per-level: 5      # Enchanting level needed for level N of an enchant: (N-1) * this
  anvil:
    mode: coins                    # coins or levels
    per-enchant-level: 250         # coins per resulting level (ultimates cost 4x)
  reforge:
    base: 400                      # price = base * (1 + rarity)^2 / 2
  accessory-bag:
    upgrade-base: 25000
    upgrade-growth: 1.8

hot-potato:
  max: 10
  weapon:
    strength: 2
  armor:
    health: 4
    defense: 2

singularity:
  fortune: 25

# ------------------------------------------------------------------------------------------------ enchants and reforges
# Overrides of the built in tables. Example:
# enchants:
#   sharpness: {max-level: 7, per-level: 5, table-max: 5}
#   telekinesis: {enabled: false}
enchants: {}
reforges:
  # Stat multiplier by rarity: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC, DIVINE, SPECIAL
  rarity-multiplier: [1.0, 1.4, 1.9, 2.6, 3.5, 4.6, 6.0, 1.0]
  disabled: []                     # reforge ids to remove

# ------------------------------------------------------------------------------------------------ accessories
accessories:
  base-slots: 9
  slots-per-upgrade: 3
  max-slots: 45
  # Magical Power by rarity of the counted accessories (one per family).
  magical-power:
    COMMON: 3
    UNCOMMON: 5
    RARE: 8
    EPIC: 12
    LEGENDARY: 16
    MYTHIC: 22
    DIVINE: 30
    SPECIAL: 3
  # Stats granted for every point of Magical Power.
  per-magical-power:
    HEALTH: 0.6
    DEFENSE: 0.25
    STRENGTH: 0.3
    INTELLIGENCE: 0.35
    CRIT_DAMAGE: 0.1
    SPEED: 0.03

# ------------------------------------------------------------------------------------------------ pets
pets:
  max-owned: 45
  hide-from-owner: false           # true = the pet visual is hidden from its owner (others still see it)
  xp-per-skill-xp: 1.0             # pet XP per skill XP of the pet's own skill
  other-skill-share: 0.0           # pet XP per skill XP of the other skills
  candy-xp: 5000
  revive-cooldown-seconds: 300     # Phoenix
  update-ticks: 2                  # how often the pet visual follows its owner
  xp-curve:
    base: 100                      # xp for level 1 -> 2 of a RARE pet; later levels grow by `growth`
    growth: 1.075
    rarity-multiplier:
      COMMON: 0.4
      UNCOMMON: 0.7
      RARE: 1.0
      EPIC: 1.6
      LEGENDARY: 2.4
      MYTHIC: 3.4
  # Stat multiplier of the pet's rarity.
  stat-multiplier:
    COMMON: 0.5
    UNCOMMON: 0.7
    RARE: 1.0
    EPIC: 1.35
    LEGENDARY: 1.8
    MYTHIC: 2.3

# ------------------------------------------------------------------------------------------------ abilities
abilities:
  hit-animals: true                # abilities may damage passive animals
  # Per ability overrides: mana, cooldown (seconds) and the numeric parameters shown in its description.
  # instant_transmission: {mana: 50, range: 8}
  # wither_impact: {mana: 150, cooldown: 3, damage: 800, radius: 6, range: 10, shield: 5}
  wither_shield:
    reduction: 0.7                 # fraction of damage blocked while the Wither Impact shield is active

# ------------------------------------------------------------------------------------------------ armor sets
# Parameters of the full set bonuses: sets.<set>.<key>
sets:
  lumberjack: {timber: 10, seconds: 8}
  farmer: {chance: 12}
  hunter: {lifesteal: 3}
  void_walker: {cooldown: 30}
  frostborne: {slow: 3, reduction: 10}

# ------------------------------------------------------------------------------------------------ items
# Any catalog item can be re-tuned: items.<id>.damage and items.<id>.stats.<stat key>, for example
# items:
#   void_blade:
#     damage: 120
#     stats: {strength: 80, crit_damage: 50}
items: {}
