# Skyblock bosses: framework settings, the six contract bosses, two world bosses, five slayers.
#
# Every number here is tunable and reloadable with /boss reload (running fights keep the definition they started with).
# A broken entry is dropped and listed in the console as "boss.yml: <path>: <problem>"; the rest still loads.
# All text is MiniMessage; keep it English. Durations in "cooldown", "telegraph", "duration" keys are SECONDS.
#
# Boss fields:   name, description, entity, health (virtual HP), damage (vanilla HP per hit, 2 = one heart),
#                scale, speed (multiplier), knockback-resistance (0-1), bar {color, overlay}, arena {...}, phases [...],
#                equipment {slot: MATERIAL or MATERIAL:#rrggbb for leather}, options {size, baby, glow, contact-radius},
#                loot {...}, summon {...}, kind (boss | world)
# Ability fields: type, cooldown, telegraph, damage (multiplier of the boss damage), target (nearest|random|top|far|all),
#                from-tier (slayers only) plus ability parameters (radius, count, duration, speed ...)
# Abilities: fireball_barrage ground_slam summon_minions lightning_strikes vacuum whirlpool poison_cloud wither_cloud
#            breath_cloud lava_pools void_zones ice_spikes web_traps teleport_behind shield_crystals laser_beam
#            charge_dash dive_bomb tidal_wave fire_ring bone_cage soul_drain blizzard
# Loot drops: item (custom:<id> or vanilla:<MATERIAL>), chance, min, max, min-share (damage share needed),
#            max-rank (worst rank allowed, 0 = anyone), magic-find (true), pity / pity-cap (bonus per dry kill)

settings:
  hp-scale: 1.0              # multiplies every boss health pool
  damage-scale: 1.0          # multiplies every hit bosses deal to players
  incoming-damage-scale: 1.0 # multiplies every hit players deal to bosses (calibrate to the items damage formula)
  tick-period: 2             # ticks between two boss updates (1-10)
  bar-range: 64              # players closer than this see the boss bar
  visual-health: 300         # max health attribute of the entity (only mirrors the percentage)
  hit-iframes: 6             # invulnerability ticks of a boss between two hits
  magic-find-cap: 1000       # Magic Find above this is ignored
  purge-orphans: true        # remove tagged boss entities left behind (bosses never persist across a restart)

bosses:
  # ----------------------------------------------------------------------------------------------------------
  # The End boss. Dragon-style flyer: circle, breath clouds, dive bombs, crystal shield. Altar in the End island.
  voidwyrm:
    name: "<gradient:#8a2be2:#e0b0ff><bold>Voidwyrm</bold></gradient>"
    description: "The dragon of the End. Dodge the dives, shatter the crystals, stay out of the breath."
    entity: ENDER_DRAGON
    health: 1500000
    damage: 14
    scale: 1.0
    speed: 1.0
    knockback-resistance: 1.0
    bar: { color: PURPLE, overlay: NOTCHED_10 }
    arena:
      radius: 80
      leash: 110
      projectile-range: 90
      no-fly: false
      no-build: true
      no-teleport: true
      min-players: 1
      scale-per-player: 0.35
      scale-cap: 4.0
      enrage-seconds: 900
      enrage-damage: 1.5
      enrage-growth: 0.25
      idle-despawn-seconds: 90
      time-limit-seconds: 1800
      max-minions: 10
    options: { glow: false, contact-radius: 9 }
    phases:
      - name: "Circling"
        at: 1.0
        abilities:
          - { type: breath_cloud, cooldown: 14, telegraph: 1.5, damage: 0.8, target: random, count: 3 }
          - { type: dive_bomb, cooldown: 18, telegraph: 2.0, damage: 2.2, target: random }
      - name: "Shielded"
        at: 0.70
        title: "<light_purple><bold>THE VOIDWYRM SCREAMS"
        subtitle: "<gray>Destroy the end crystals!"
        damage: 1.15
        enter:
          - { type: shield_crystals, count: 4, radius: 22, height: 6, hits: 3, seconds: 45, heal: 0.004, nova: 8 }
        abilities:
          - { type: breath_cloud, cooldown: 12, telegraph: 1.5, damage: 0.9, target: random, count: 4 }
          - { type: dive_bomb, cooldown: 16, telegraph: 1.8, damage: 2.4, target: top }
          - { type: summon_minions, cooldown: 25, entity: ENDERMITE, count: 4, health: 60, radius: 8, name: "<dark_purple>Void Mite" }
      - name: "Unbound"
        at: 0.35
        title: "<dark_purple><bold>THE VOID UNBOUND"
        subtitle: "<gray>It stops holding back."
        damage: 1.35
        speed: 1.2
        abilities:
          - { type: void_zones, cooldown: 12, telegraph: 1.5, damage: 0.8, target: all, count: 5 }
          - { type: breath_cloud, cooldown: 10, telegraph: 1.2, damage: 1.0, target: random, count: 5 }
          - { type: dive_bomb, cooldown: 12, telegraph: 1.5, damage: 2.6, target: top }
          - { type: lightning_strikes, cooldown: 16, telegraph: 1.4, damage: 1.6, target: all, count: 6 }
    loot:
      coins: 400000
      combat-xp: 60000
      min-share: 0.01
      share-floor: 0.25
      rank-bonus: [1.5, 1.25, 1.1]
      wings-min-share: 0.05      # damage share needed for WingsApi.grantOnce(player, "boss:voidwyrm")
      announce-below: 0.02
      drops:
        - { item: "custom:wing_core", chance: 1.0, min: 1, max: 1, min-share: 0.05, magic-find: false }
        - { item: "custom:voidwyrm_scale", chance: 0.9, min: 3, max: 8 }
        - { item: "custom:void_fang", chance: 0.04, min: 1, max: 1, min-share: 0.10, max-rank: 5, pity: 0.002, pity-cap: 0.04 }
        - { item: "vanilla:DRAGON_EGG", chance: 0.01, min: 1, max: 1, min-share: 0.10, max-rank: 1 }
    summon:
      item: void_sigil
      mode: altar
      altar: { world: sb_end, x: 0, y: 70, z: 0, radius: 40 }   # adjust to the End island altar
      worlds: [sb_end]
      cooldown-seconds: 300
      global-cooldown-seconds: 0
      require-island-member: false
      max-concurrent: 1
      refund-on-despawn: true

