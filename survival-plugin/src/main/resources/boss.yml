# ------------------------------------------------------------------------------------------------------------
# World boss events. The event picks a boss from the pool and a spot, warns everyone, spawns it, ranks the damagers.
world-bosses:
  enabled: true
  interval-minutes: 120           # server uptime between two events
  first-spawn-delay-minutes: 30   # delay before the first event after a fresh install
  min-players: 1                  # players online in Skyblock worlds needed to start an event
  announce-before-seconds: [300, 60, 10]
  duration-minutes: 15            # the boss leaves after this long
  retry-minutes: 5                # when too few players are online, check again after this long
  leaderboard-size: 5
  history-size: 10
  locations:
    # Hub adjacent arenas: edit to match the hub build.
    - { world: sb_hub, x: 0, y: 80, z: 60, name: "Hub Fields" }
    - { world: sb_hub, x: 0, y: 80, z: -60, name: "North Plateau" }
  pool:
    - { boss: ancient_colossus, weight: 1.0 }
    - { boss: storm_roc, weight: 1.0 }

