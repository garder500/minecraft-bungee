# Item keys: UPPER CASE = vanilla material, lower case = custom item id registered by another feature
# (for example "boss_grave_key"). Unknown ids are skipped silently, so you can list custom items before the
# feature that registers them is installed. buy = what the player pays, sell = what the merchant pays.
# Always keep buy above sell for the same item (the test suite checks the shipped tables for craft loops).
