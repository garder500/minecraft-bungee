bazaar:
  enabled: true
  # Percent of each sale kept by the market (taken from the seller on every fill, instant sells included).
  tax-percent: 1.25
  # Open orders a player may have (buy and sell together) and the largest single order.
  max-orders: 14
  max-amount: 71680
  # Highest price per item, in coins.
  max-price: 100000000
  # Orders must stay within this factor of the 24h average price (5 = from 1/5 to 5 times; 1 or less disables it).
  # Stops manipulation with absurd prices.
  price-band: 5.0
  # Hours of hourly price history kept per product (24..336).
  history-hours: 72
  # The market file is written this many ticks after a change; changes in the same window share one write.
  persist-delay-ticks: 10
