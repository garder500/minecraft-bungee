auction:
  enabled: true
  # Active listings per player.
  max-listings: 7
  # Starting bid / Buy It Now bounds, in coins.
  min-price: 10
  max-price: 1000000000
  # Percent of the final price taken from the seller when an auction sells.
  tax-percent: 1.0
  # A bid must beat the top bid by this percent, and by at least bid-increment-min coins.
  bid-increment-percent: 5
  bid-increment-min: 1
  # A bid in the last window seconds restarts the clock to "extend" seconds (anti sniping), max-extensions times.
  anti-snipe-window-seconds: 120
  anti-snipe-extend-seconds: 120
  max-extensions: 10
  # Hours a listing may last (the menu cycles through these) and the default.
  durations-hours: [1, 6, 12, 24, 48]
  default-duration-hours: 12
  # Listing fee, paid up front and never refunded: price * (base-percent + per-day-percent * hours / 24) %,
  # between min and max coins.
  listing-fee:
    base-percent: 1.0
    per-day-percent: 0.5
    min: 25
    max: 5000000
  # Finished sales kept for /ah history and the "recent price" line.
  history-size: 300
  # Items that can never be listed: vanilla materials or custom item ids. Wings are always refused.
  blocked-materials: [BEDROCK, BARRIER, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK, STRUCTURE_BLOCK, JIGSAW, DEBUG_STICK, KNOWLEDGE_BOOK, SPAWNER, TRIAL_SPAWNER, VAULT, REINFORCED_DEEPSLATE]
  blocked-items: []
  # Refuse an item whose serialised form is larger than this (stops giant shulker boxes bloating the file).
  max-item-chars: 200000
  persist-delay-ticks: 10
