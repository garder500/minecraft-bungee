# Recipes: shapeless, any arrangement of exactly the listed number of slots. Each slot needs `per_slot` items.
#   ingredients: [{item: MATERIAL | custom: item_id, slots: 1-9, per_slot: 1-64}]  (at most 9 slots in total)
#   result_custom: item id | result_item: MATERIAL, amount: 1-64
#   requires: {COLLECTION_ID: tier}  the crafter needs every tier; the result shows "Recipe locked" until then
#   xp: {skill: ENCHANTING, amount: n}  optional experience per craft
# Two recipes must not share the same ingredient items (tier 2 uses the tier 1 custom item, so they differ).
