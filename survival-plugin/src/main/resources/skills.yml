anti_farm:
  # Diminishing returns for the same spot: after `free` events inside `window_seconds` in one cell of
  # `cell` x `cell` x `cell` blocks, each further event gives `step` less experience (never below `min`).
  mobs: {cell: 4, window_seconds: 120, free: 25, step: 0.04, min: 0.1}
  blocks: {cell: 1, window_seconds: 30, free: 4, step: 0.2, min: 0.1}

fortune:
  # Mining/Farming/Foraging Fortune from the stats engine adds drops to blocks that give skill experience
  # (100 fortune = one extra item per dropped item on average).
  enabled: true
  max_multiplier: 10

placed_tracking:
  # Extra block types remembered when placed (everything with experience or a collection already is).
  extra: []

leaderboard:
  refresh_seconds: 300
  size: 100
  max_files: 20000

