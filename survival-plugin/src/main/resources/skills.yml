        - {from: 1, to: 14, amount: 1}
        - {from: 15, to: 60, amount: 0.5}
    unlocks:
      5: "Trees fall faster to your axe."
      10: "You know every kind of wood."
      20: "A seasoned lumberjack."
      30: "The forest is your home."
      40: "Woodcutter of legend."
      50: "Master forester."
      60: "The forest answers to you."
