# Skyblock skills, collections and collection-gated recipes (feature "skills").
# Edit this file in plugins/VampyuyuSurvival/skills.yml; /skilladmin reload applies it without a restart.
# Keys missing from your copy fall back to the jar's defaults. A bad entry is skipped with a console warning.

# Skills only earn experience in Skyblock worlds (sb_hub, sb_world, sb_nether, sb_end, dungeons).
only_skyblock_worlds: true
# Worlds that never give experience even when allowed above.
blocked_worlds: []
# Global experience multiplier applied before skill multipliers and boosts. 1.0 = normal.
xp_multiplier: 1.0

boosts:
  # Cap of the combined /skilladmin boost multiplier (boosts add up as 1 + sum(m - 1)).
  max_total: 10.0

levels:
  default_max: 60
  # Experience to go from level n-1 to n is base * growth^(n-1), rounded to significant_digits digits.
  # A smooth curve: level 10 needs about 1.3k total, level 30 about 60k, level 60 about 14M.
  base: 50
  growth: 1.2
  significant_digits: 2
  # Optional explicit list (one number per level, at least as long as the highest max_level) that overrides the curve.
  xp_table: []

rewards:
  coins:
    # Coins paid at each level: base + step * level, multiplied on every milestone_every-th level.
    base: 200
    step: 40
    milestone_every: 10
    milestone_multiplier: 5

average:
  # Skills counted in the skill average. Empty = every skill except Carpentry.
  skills: []

# Per skill: max_level, multiplier (extra experience factor) and the stat bonuses given per level.
# stats.<STAT>: list of {from, to, amount}: every level from..to adds `amount` of the stat.
# Stat bonuses reach the stats engine as the modifier source "skill:<skill>".
skills:
  combat:
    max_level: 60
    multiplier: 1.0
    stats:
      CRIT_CHANCE:
        - {from: 1, to: 60, amount: 0.4}
      STRENGTH:
        - {from: 1, to: 20, amount: 0.5}
        - {from: 21, to: 60, amount: 0.75}
    unlocks:
      5: "You are getting the hang of fighting."
      10: "Monsters think twice before attacking you."
      20: "A veteran of many fights."
      30: "Crits come naturally now."
      40: "Few things can stop you."
      50: "A true slayer."
      60: "The pinnacle of combat."
  mining:
    max_level: 60
    multiplier: 1.0
    stats:
      MINING_FORTUNE:
        - {from: 1, to: 20, amount: 2}
        - {from: 21, to: 60, amount: 3}
      DEFENSE:
        - {from: 1, to: 14, amount: 1}
        - {from: 15, to: 60, amount: 2}
    unlocks:
      5: "The earth gives up its ores more easily."
      10: "Your pickaxe sings."
      20: "A seasoned miner."
      30: "Veins reveal themselves to you."
      40: "Deep miner."
      50: "Master of the mines."
      60: "The mountain bows to you."
  farming:
    max_level: 60
    multiplier: 1.0
    stats:
      FARMING_FORTUNE:
        - {from: 1, to: 20, amount: 2}
        - {from: 21, to: 60, amount: 3}
      HEALTH:
        - {from: 1, to: 14, amount: 2}
        - {from: 15, to: 19, amount: 3}
        - {from: 20, to: 25, amount: 4}
        - {from: 26, to: 60, amount: 5}
    unlocks:
      5: "Your crops grow stronger."
      10: "Green thumbs."
      20: "A bountiful harvest."
      30: "The fields love you."
      40: "Farmer of renown."
      50: "Master of the harvest."
      60: "Nothing grows without your blessing."
  foraging:
    max_level: 60
