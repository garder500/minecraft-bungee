#   block: the block it works with (MINING: placed and broken, FARMING: the crop, FORAGING: the log)
#   sapling: FORAGING only                        ageable: FARMING crops that have an age (false for pumpkin, melon)
#   support: needs a solid block below the spot (sand)   mob: ANIMAL / COMBAT creature spawned and killed
#   mode: each (every drop rolls its own chance) or weighted (one drop picked by its chance as weight)
