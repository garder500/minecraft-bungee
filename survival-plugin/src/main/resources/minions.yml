# Minions: every number, cost, name and drop rate of the minions feature.
# Edit the copy in plugins/VampyuyuSurvival/minions.yml and restart the server (no hot reload).
# A bad entry is skipped with a warning in the log, the rest keeps working.

settings:
  # Ticker period in server ticks (20 = once a second). Production itself is timestamp based, so this only
  # decides how smooth the animation and the status line are.
  tick-ticks: 20
  # A minion does real block work (places and breaks blocks, spawns its animal, swings its arm) only while a
  # player is closer than this many blocks. Otherwise the same production is computed without touching blocks.
  visual-range: 48
  # How often (seconds) the surroundings of a minion nobody is looking at are re-checked.
  scan-seconds: 10
  # Longest offline / unloaded-chunk catch-up window, in hours. Production is also capped by the storage.
  max-catchup-hours: 336
  # Island checks (reset, kicked from a co-op) in seconds.
  island-check-seconds: 30
  # A minion whose island has been gone for this many hours (deleted, no replacement) is returned to its owner
  # through the owed list. Not counted across restarts.
  island-missing-hours: 6
  # When true, co-op members can also take items out of a minion's storage. Taking upgrades and hats out, and
  # picking a minion up, stay with the owner (or the island owner, whose pick-up goes to the minion's owner).
  member-collect: false
  # Minimum time between two clicks in a minion menu (every item move writes the minion file to disk).
  gui-click-millis: 150
  # Minion slots: base + one per threshold reached by the number of different minions (type + tier) crafted.
  base-slots: 5
  max-slots: 30
  slot-thresholds: [5, 15, 30, 50, 75, 100, 125, 150, 175, 200, 225, 250]
  # Hard limit of minions on one island, all players together.
  per-island-cap: 48
  # Size of the minion body (1.0 = player size).
  scale: 0.7
  # Units of a resource needed for one compacted item, and compacted items for one super compacted item.
  compact-ratio: 160
  super-ratio: 160
  # Diamond Spreading: one bonus diamond every N produced items.
  spread-every: 10
  # Most fuel a minion can hold, in hours.
  fuel-max-hours: 168
  # Upgrade slots on every minion (fuel, skin and hat have their own slot).
  upgrade-slots: 2
  # Minimum water blocks (layer under the minion) a Fishing Minion needs.
  fishing-min-water: 3
  # Chat message to the owner when a minion gets blocked, at most once per this many seconds per minion.
  chat-cooldown-seconds: 120
  # Action seconds are the time between two actions. A cycle (one resource) takes this many actions:
  # place + break, plant + harvest, spawn + kill. Fishing casts once.
  actions-per-cycle: 2
  fishing-actions-per-cycle: 1

# Per tier tables (11 values, tier I first).
tiers:
  # The action time of a type is multiplied by this.
  action-factor: [1.0, 1.0, 0.857, 0.857, 0.714, 0.714, 0.643, 0.643, 0.571, 0.571, 0.5]
  # Storage slots (a slot holds one stack).
  storage-slots: [1, 3, 6, 9, 12, 15, 18, 21, 24, 27, 30]
  # Working radius: 2 = 5x5, 3 = 7x7.
  radius: [2, 2, 2, 2, 2, 2, 2, 2, 3, 3, 3]
  # Rarity of the minion item.
  rarity: [COMMON, COMMON, UNCOMMON, UNCOMMON, RARE, RARE, EPIC, EPIC, LEGENDARY, LEGENDARY, MYTHIC]
  # Chestplate the body wears.
  chestplate: [LEATHER_CHESTPLATE, LEATHER_CHESTPLATE, GOLDEN_CHESTPLATE, GOLDEN_CHESTPLATE, CHAINMAIL_CHESTPLATE,
    CHAINMAIL_CHESTPLATE, IRON_CHESTPLATE, IRON_CHESTPLATE, DIAMOND_CHESTPLATE, DIAMOND_CHESTPLATE,
    NETHERITE_CHESTPLATE]
  # Cost of going from tier N to N+1 (10 values): the compacted ("compact") or super compacted ("super") form of
  # the minion's main resource, and how many of them.
  tier-up-item: [compact, compact, compact, compact, compact, compact, compact, super, super, super]
  tier-up-amount: [8, 8, 8, 8, 8, 8, 8, 2, 4, 8]

# Fuels, burned only while the minion is actually working. Speeds of fuel and upgrades add up.
#   material: base item; custom: false means the plain vanilla item is the fuel
#   speed: +fraction of speed (0.25 = 25 percent faster)   hours: how long one item lasts
#   kinds: optional list of minion kinds the fuel works on (MINING FARMING FORAGING ANIMAL COMBAT FISHING)
fuels:
  coal:
    material: COAL
    custom: false
    speed: 0.05
    hours: 0.5
  coal_block:
    material: COAL_BLOCK
    custom: false
    speed: 0.05
    hours: 5
  # "compressed" means the fuel IS the Enchanted item the minion menu makes from that resource (Compress button),
  # so it can be obtained in normal play. name, rarity and custom are then ignored.
  enchanted_coal:
    name: Enchanted Coal
    rarity: UNCOMMON
    material: COAL
    compressed: COAL
    speed: 0.10
    hours: 24
  enchanted_charcoal:
    name: Enchanted Charcoal
    rarity: RARE
    material: CHARCOAL
    compressed: CHARCOAL
    speed: 0.20
    hours: 36
  enchanted_lava_bucket:
    name: Enchanted Lava Bucket
    rarity: EPIC
    material: LAVA_BUCKET
    custom: true
    speed: 0.25
    hours: 48
  hamster_wheel:
    name: Hamster Wheel
    rarity: EPIC
    material: HAY_BLOCK
    custom: true
    speed: 0.50
    hours: 24
    kinds: [FARMING]
  foul_flesh:
    name: Foul Flesh
    rarity: EPIC
    material: ROTTEN_FLESH
    custom: true
    speed: 0.90
    hours: 5
    kinds: [MINING, FORAGING, ANIMAL, COMBAT, FISHING]
  catalyst:
    name: Catalyst
    rarity: LEGENDARY
    material: BLAZE_POWDER
    custom: true
    speed: 2.00
    hours: 3
  hyper_catalyst:
    name: Hyper Catalyst
    rarity: LEGENDARY
    material: GLOWSTONE_DUST
    custom: true
    speed: 3.00
    hours: 6

# Upgrade items for the upgrade slots.
#   effect: SMELT COMPACT SUPER_COMPACT SPREAD EXPAND SPEED
#   speed: +fraction of speed   burn: fuel burn rate multiplier (0.8 = fuel lasts 25 percent longer)
#   radius: extra working radius (EXPAND)
upgrades:
  auto_smelter:
    name: Auto Smelter
    rarity: UNCOMMON
    material: FURNACE
    effect: SMELT
    lore: ["Smelts what the minion makes on the spot.", "Cobblestone becomes stone, logs charcoal, food gets cooked."]
  compactor:
    name: Compactor
    rarity: UNCOMMON
    material: PISTON
    effect: COMPACT
    lore: ["Compacts a full ratio of a resource into one enchanted item."]
  super_compactor:
    name: Super Compactor 3000
    rarity: RARE
    material: STICKY_PISTON
    effect: SUPER_COMPACT
    lore: ["Compacts resources, then compacts the enchanted items into super enchanted ones.", "Replaces the Compactor."]
  diamond_spreading:
    name: Diamond Spreading
    rarity: RARE
    material: DIAMOND
    effect: SPREAD
    lore: ["One bonus diamond every few items produced."]
  minion_expander:
    name: Minion Expander
    rarity: RARE
    material: OBSERVER
    effect: EXPAND
    radius: 1
    lore: ["Widens the working area by one block on each side."]
  flycatcher:
    name: Flycatcher
    rarity: EPIC
    material: SPIDER_EYE
    effect: SPEED
    speed: 0.20
    lore: ["The minion works 20 percent faster, forever."]
  mithril_infusion:
    name: Mithril Infusion
    rarity: EPIC
    material: PRISMARINE_SHARD
    effect: SPEED
    speed: 0.10
    burn: 0.8
    lore: ["10 percent faster and the fuel lasts 25 percent longer."]

# Crafting recipes of upgrades, hats and custom fuels (shaped, 3x3 at most). Ingredient specs:
#   MATERIAL (exactly that plain vanilla item), enchanted:MATERIAL / super:MATERIAL (made with the minion menu's
#   Compress button), upgrade:<id>, skin:<id>, fuel:<id>. result: upgrade:<id>, skin:<id> or fuel:<id>.
recipes:
  auto_smelter:
    result: upgrade:auto_smelter
    shape: ["EEE", "EFE", "EEE"]
    ingredients: {E: "enchanted:COAL", F: FURNACE}
  compactor:
    result: upgrade:compactor
    shape: ["EEE", "EPE", "EEE"]
    ingredients: {E: "enchanted:REDSTONE", P: PISTON}
  super_compactor:
    result: upgrade:super_compactor
    shape: ["EEE", "ECE", "EEE"]
    ingredients: {E: "enchanted:IRON_INGOT", C: "upgrade:compactor"}
  diamond_spreading:
    result: upgrade:diamond_spreading
    shape: ["EEE", "EDE", "EEE"]
    ingredients: {E: "enchanted:DIAMOND", D: DIAMOND_BLOCK}
  minion_expander:
    result: upgrade:minion_expander
    shape: ["EEE", "EOE", "EEE"]
    ingredients: {E: "enchanted:COBBLESTONE", O: OBSERVER}
  flycatcher:
    result: upgrade:flycatcher
    shape: ["EEE", "ESE", "EEE"]
    ingredients: {E: "enchanted:LAPIS_LAZULI", S: SPIDER_EYE}
  mithril_infusion:
    result: upgrade:mithril_infusion
    shape: ["EEE", "ESE", "EEE"]
    ingredients: {E: "enchanted:EMERALD", S: PRISMARINE_SHARD}
  enchanted_lava_bucket:
    result: fuel:enchanted_lava_bucket
    shape: ["EEE", "ELE", "EEE"]
    ingredients: {E: "enchanted:COAL", L: LAVA_BUCKET}
  hamster_wheel:
    result: fuel:hamster_wheel
    shape: ["EEE", "EHE", "EEE"]
    ingredients: {E: "enchanted:WHEAT", H: HAY_BLOCK}
  foul_flesh:
    result: fuel:foul_flesh
    shape: ["EEE", "EEE", "EEE"]
    ingredients: {E: "enchanted:ROTTEN_FLESH"}
  pumpkin_hat:
    result: skin:pumpkin_hat
    shape: ["EEE", "EPE", "EEE"]
    ingredients: {E: "enchanted:PUMPKIN", P: CARVED_PUMPKIN}
  golden_helmet:
    result: skin:golden_helmet
    shape: ["EEE", "EHE", "EEE"]
    ingredients: {E: "enchanted:GOLD_INGOT", H: GOLDEN_HELMET}
  diamond_helmet:
    result: skin:diamond_helmet
    shape: ["EEE", "EHE", "EEE"]
    ingredients: {E: "enchanted:DIAMOND", H: DIAMOND_HELMET}

