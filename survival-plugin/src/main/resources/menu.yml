# Skyblock "menu" feature: join router, Skyblock Menu item, warps, quests, fairy souls, sidebar, settings.
# Everything here is read at start and by "/sbmenu reload" (permission vampyuyu.sb.menu.admin).
# All player-visible text is English.

# ------------------------------------------------------------------ join router
join:
  # What to do with a player who joins WITHOUT a valid cross-server key (sb:transfer:<uuid> in Redis):
  #   stay = do not move them (plain survival players keep their spawn)   <- default
  #   hub  = send them to sb_hub (docs/skyblock-design.md section 12), unless they already stand in a Skyblock world
  no-key: stay
  # A key whose "ts" (epoch millis, optional) is older than this is ignored.
  max-age-seconds: 30
  # Command the "create island" prompt runs when a player arrives in the hub without an island.
  create-island-command: "island create"
  redis:
    enabled: true
    # Empty = ARENA_REDIS_HOST (default "redis") / ARENA_REDIS_PASSWORD_FILE (default /run/secrets/arena_redis_password)
    host: ""
    port: 6379
    password-file: ""
    connect-timeout-ms: 1500
    socket-timeout-ms: 1500
    # After a Redis failure, joins skip Redis for this long (a dead Redis never delays logins)
    backoff-seconds: 30

# Where a player respawns after dying in a Skyblock world (a bed or respawn anchor always wins):
#   island = their island spawn (hub when they have none), hub = always the hub, none = leave the server default.
respawn:
  route: island

# ------------------------------------------------------------------ the Skyblock Menu item
menu-item:
  enabled: true
  # Hotbar index 0-8 (8 = the 9th slot)
  slot: 8
  # Right-click cooldown in milliseconds (the client sends two events per click)
  click-cooldown-ms: 250

# Commands of the other features, tried in order; the first that exists AND the player may use wins. When none
# exists the entry is greyed out ("not available"). Menu entries run them as the player.
commands:
  skills: [skills, skill]
  collections: [collections, collection]
  pets: [pets, pet]
  accessories: [accessories, accessorybag, talismans]
  bazaar: [bazaar, bz]
  auction: [auctionhouse, ah, auction]
  island: [island, is]
  recipes: [recipes, recipebook, recipe]
  leaderboards: [leaderboards, leaderboard, lb]
  minions: [minions, minion]
  bank: [bank]
  boss: [boss, bosses]
  dungeon: [dungeon, dungeons]

# ------------------------------------------------------------------ warps
warps:
  # Players stand still this long before the teleport; moving or taking damage cancels it
  warmup-seconds: 3
  cooldown-seconds: 5
  # Optional exact destinations (world is fixed by the key). Without x/y/z the world spawn is used.
  nether: {}
  #  nether: {x: 0.5, y: 70, z: 0.5, yaw: 0, pitch: 0}
  end: {}
  # Shown on the "Boss arenas" item (the boss feature owns the arenas; this is only a hint)
  boss-hint: "Summon bosses with their summon items on your island or in the arenas."

# ------------------------------------------------------------------ sidebar
sidebar:
  enabled: true
  title: "<gradient:#7b2ff7:#00d4ff><bold>SKYBLOCK</bold></gradient>"
  # Last line (MiniMessage); empty to omit
  footer: "<yellow>vampyuyu.win"
  update-ticks: 20
  # Location names when no zone below matches, by world token (hub, world, nether, end)
  default-zones:
    hub: "Hub"
    world: "Island"
    nether: "The Nether"
    end: "The End"
  # Named regions, first match wins: world token or name + inclusive box.
  zones:
    - {name: "Hub Spawn", world: hub, min: [-16, -64, -16], max: [16, 320, 16]}
    - {name: "Hub Village", world: hub, min: [-96, -64, -96], max: [96, 320, 96]}
    - {name: "Wilderness", world: nether, min: [-30000000, -64, -30000000], max: [30000000, 320, 30000000]}
    - {name: "The Void Gate", world: end, min: [-60, 0, -60], max: [60, 320, 60]}

# ------------------------------------------------------------------ damage indicators
damage-indicators:
  enabled: true
  # Lifetime of the floating number, ticks
  lifetime-ticks: 24
  # At most this many numbers per attacker per second
  max-per-second: 12

# ------------------------------------------------------------------ sounds (vanilla sound keys)
sounds:
  welcome: "entity.player.levelup"
  quest-complete: "ui.toast.challenge_complete"
  quest-progress: "entity.experience_orb.pickup"
  soul-found: "entity.allay.item_given"
  milestone: "entity.player.levelup"
  teleport: "entity.enderman.teleport"
  click: "ui.button.click"

# ------------------------------------------------------------------ fairy souls
fairy-souls:
  enabled: true
  # Souls are spawned for a player when they are within this many blocks
  view-distance: 40
  # Walk this close to a soul to collect it
  collect-radius: 1.6
  # A milestone pays every N souls (0 disables rewards)
  every: 5
  coins-per-milestone: 250
  # Stat bonus of milestone number n (1-based) is step ((n-1) mod size); bonuses add up (source "fairy")
  stat-cycle:
    - {stat: HEALTH, amount: 2}
    - {stat: DEFENSE, amount: 1}
    - {stat: STRENGTH, amount: 1}
    - {stat: SPEED, amount: 1}
  # Glow colour of the soul (hex)
  glow-color: "#ff7ad9"
  # Souls at fixed positions: id (a-z, 0-9, _), world token hub/world/nether/end, coordinates.
  # Admins add more in game with /fairy admin add (kept in menu/fairy_souls.json).
  fixed: []
  #  - {id: hub_fountain, world: hub, x: 0.5, y: 70, z: 8.5}
  # Souls on every island, as offsets from the island centre (one id counts once per player, on any island)
  island:
    - {id: island_1, x: 4.5, y: 1.5, z: 0.5}
    - {id: island_2, x: -5.5, y: 1.5, z: 3.5}
    - {id: island_3, x: 0.5, y: 2.5, z: -7.5}
    - {id: island_4, x: 8.5, y: 2.0, z: 6.5}
    - {id: island_5, x: -9.5, y: 2.0, z: -5.5}
    - {id: island_6, x: 0.5, y: 8.5, z: 0.5}
    - {id: island_7, x: 12.5, y: 1.5, z: -3.5}
    - {id: island_8, x: -12.5, y: 1.5, z: 8.5}

# ------------------------------------------------------------------ quests
quests:
  enabled: true
  # Quest day: new daily quests start at this local time in this zone
  daily:
    reset-time: "04:00"
    time-zone: "UTC"
    count: 3
    # Paid once when all of the day's daily quests are done: base + per-day * min(streak, cap)
    bonus-coins: 150
    streak-bonus-coins: 50
    streak-cap: 10
    bonus-skill-xp: 40
    # Coin gains with a reason starting with one of these do not count for "earn coins" quests
    ignore-coin-reasons: [bank, quest, daily, fairy, pay, trade, refund, admin, auction, sell_back]
    # How many player-placed blocks are remembered per player (placed blocks do not count for break quests)
    placed-memory: 2048
