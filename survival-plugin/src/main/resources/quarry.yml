# The Quarry: cobble draw, custom ores and the Forge. Every number is a proposal and can be changed freely.
#
# Cobble draw. A block of cobblestone formed by water meeting lava on an island (a "generator") is marked; breaking a
# marked block rolls this table. Placed cobblestone is never marked, so it cannot be farmed.
generator:
  # Percent of blocks that are a geode: 3 to 6 of the first "geode: true" ore the generator tier can give.
  geode-chance: 0.05
  geode-min: 3
  geode-max: 6
  # Mining luck (from the held pickaxe) is capped here.
  luck-cap: 300
  # Number of generator tiers whose chance lists are given below. The Bronze Core unlocks tier II (Vein), the Ember
  # Core tier III (Ember), the Void Lens tier IV (Void).
  # Geodes of tier IV or higher also add one Starcore Shard now and then.
  geode-bonus: {ore: starcore, percent: 5, from-tier: 4}
  tiers: 4

# Rarest first. chance: percent per block for tier I, II, III, IV (0 = not available). pity: blocks without this ore after
# which the next block is guaranteed to give it (0 = none). item: a vanilla material or custom:<item id>.
ores:
  starcore:
    item: custom:starcore
    chance: [0, 0, 0, 0]
  voidglass:
    item: custom:voidglass
    chance: [0, 0, 0, 0.04]
    pity: 7500
    geode: true
  ancient_debris:
    item: ANCIENT_DEBRIS
    chance: [0, 0, 0.15, 0.2]
    pity: 2000
  sunstone:
    item: custom:sunstone
    chance: [0, 0, 0.25, 0.3]
    pity: 1500
    geode: true
  diamond:
    item: DIAMOND
    chance: [0, 0.5, 0.6, 0.6]
    pity: 600
  frostium:
    item: custom:frostium
    chance: [0, 0.8, 1.0, 0.8]
    pity: 400
    geode: true
  bronzite:
    item: custom:bronzite
    chance: [3.0, 3.0, 2.0, 1.0]
    pity: 120
    geode: true
  gold_nugget:
    item: GOLD_NUGGET
    chance: [0, 3.0, 3.0, 2.0]
  iron_nugget:
    item: IRON_NUGGET
    chance: [10.0, 10.0, 8.0, 6.0]
  copper:
    item: RAW_COPPER
    chance: [7.0, 7.0, 6.0, 5.0]
  coal:
    item: COAL
    chance: [6.0, 6.0, 5.0, 4.0]

# The Forge: a placeable block that turns ores into equipment. Jobs keep running while the player is offline.
