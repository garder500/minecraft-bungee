# Machines: blocks that touch each other share their Flux (the energy unit). Cables conduct, generators make Flux from
# coal (right-click one holding coal), batteries store it, miners break the generator cobble next to them and put the
# ore in a chest or barrel next to them. They only work while their chunk is loaded.
machines:
  max-per-island: 60
  coal-generator:
    output: 10
    coal-seconds: 40
  battery:
    capacity: 10000
  solar-panel:
    output: 6
  miner-1:
    consume: 8
    cycles-per-second: 0.5
  miner-2:
    consume: 20
    cycles-per-second: 1

# Tutorial quests of the Quarry. The quest feature appends them to its own tutorial line (see menu.yml for the format);
# ORE_FOUND, FORGE_ITEM and GENERATOR_UPGRADE are fed by this feature.
quests:
  tutorial:
    lucky_cobble:
      name: "Lucky Cobble"
      description: "Break cobblestone from a generator (water meeting lava) until an ore drops."
      type: ORE_FOUND
      amount: 1
      icon: COBBLESTONE
      requires: [craft_pickaxe]
      rewards: {coins: 50}
    nugget_stash:
      name: "Nugget Stash"
      description: "Collect 36 iron nuggets from your generator. Nine nuggets make an iron ingot."
      type: ORE_FOUND
      target: iron_nugget
      amount: 36
      icon: IRON_NUGGET
      requires: [lucky_cobble]
      rewards: {coins: 100}
    build_forge:
      name: "Forge Ahead"
      description: "Craft a Forge in a crafting table: a blast furnace, 4 iron ingots and 4 coal. Place it, then open it with /forge."
      type: CRAFT_ITEM
      target: custom:forge
      amount: 1
      icon: BLAST_FURNACE
      requires: [nugget_stash]
      rewards: {coins: 150}
    find_bronzite:
      name: "Bronze Age"
      description: "Find 12 Bronzite in your generator."
      type: ORE_FOUND
      target: bronzite
      amount: 12
      icon: RAW_COPPER
      requires: [build_forge]
      rewards: {coins: 200}
    forge_cleaver:
      name: "First Blade"
      description: "Forge a Bronze Cleaver: type /forge (or right-click your Forge block), pick the recipe, and collect it when the timer ends."
      type: FORGE_ITEM
      target: bronze_cleaver
      amount: 1
      icon: IRON_SWORD
      requires: [find_bronzite]
      rewards: {coins: 150, items: {skin_kitsune: 1}}
    forge_core:
      name: "A Better Generator"
      description: "Forge a Bronze Core with /forge (32 Bronzite and 8 iron ingots)."
      type: FORGE_ITEM
      target: bronze_core
      amount: 1
      icon: AMETHYST_SHARD
      requires: [find_bronzite]
      rewards: {coins: 250}
    upgrade_vein:
      name: "Into the Vein"
      description: "Hold the Bronze Core and right-click on your island to reach generator tier II."
      type: GENERATOR_UPGRADE
      target: "2"
      amount: 1
      icon: GOLD_NUGGET
      requires: [forge_core]
      rewards: {coins: 300}
    find_frostium:
      name: "Cold Find"
      description: "Find 10 Frostium. Tier II generators can drop it."
      type: ORE_FOUND
      target: frostium
      amount: 10
      icon: PRISMARINE_CRYSTALS
      requires: [upgrade_vein]
      rewards: {coins: 400}
    forge_rimeblade:
      name: "Cold Steel"
      description: "Forge a Rimeblade with /forge, from a Bronze Cleaver and 10 Frostium."
      type: FORGE_ITEM
      target: rimeblade
      amount: 1
      icon: DIAMOND_SWORD
      requires: [find_frostium, forge_cleaver]
      rewards: {coins: 500}
    forge_ember:
      name: "Kindling"
      description: "Forge an Ember Core with /forge, then hold it and right-click on your island for generator tier III."
      type: GENERATOR_UPGRADE
      target: "3"
      amount: 1
      icon: FIRE_CHARGE
      requires: [find_frostium]
      rewards: {coins: 600}
