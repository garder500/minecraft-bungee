# The public site (site/), served read-only by the `site` service of compose.prod.yaml behind Traefik
# (vampyuyu.win, www.vampyuyu.win). Plain static files: no PHP, no proxy, no upload.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Traefik terminates TLS; keep the browser on HTTPS and the pages out of frames and sniffing.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Everything is same-origin (fonts and images are self-hosted); the scripts are files, not inline.
    # Inline style attributes stay allowed: the role-card fan and the polaroids set CSS variables in the markup.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Notes for the maintainers stay in the repository, not on the web.
    location ~ (^|/)\. { return 404; }
    location ~* \.md$ { return 404; }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
